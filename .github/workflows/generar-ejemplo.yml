# Uso único: genera una aplicación de ejemplo con Angular 11, Node 14 y npm 6 (como la Oficina Virtual)
# y la sube a la rama «semilla». Se elimina después de usarla.
name: Generar ejemplo Angular 11

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "14"

      - name: Generar el proyecto
        run: |
          npm install -g @angular/cli@11
          ng new ensayo-cdat-ov --defaults --skip-git --routing=false --style=css
          {
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "angular-cli: $(ng version 2>/dev/null | grep -m1 'Angular CLI')"
          } > ensayo-cdat-ov/VERSIONES.txt
          cat ensayo-cdat-ov/VERSIONES.txt
          rm -rf ensayo-cdat-ov/node_modules
          shopt -s dotglob
          mv ensayo-cdat-ov/* .
          rmdir ensayo-cdat-ov

      - name: Subir a la rama semilla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b semilla
          git add -A
          git commit -m "Proyecto Angular 11 generado con Node 14 y npm 6"
          git push origin semilla
